# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-march=znver2 -mtune=znver2 -O2 -pipe -fno-plt -finline-functions -fomit-frame-pointer"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

PORTDIR="/var/db/repos/gentoo"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
PORTAGE_TMPDIR="/tmp"

#http_proxy="192.168.0.102:8979" 
#https_proxy="192.168.0.102:8979"

#CC="gcc"
#CXX="g++"
#LD="ld.gold"
#CMAKE_MAKEFILE_GENERATOR="ninja"
#EXTRA_ECONF="--with-gnu-ld"
#HOST="x86_64-pc-linux-gnu"

PORTAGE_COMPRESS="zstd"
PORTAGE_COMPRESS_BIN="zstd"
PORTAGE_COMPRESS_FLAGS="-1"

POWER_MANAGEMENT="acpi cpufreq"

# NOTE: This stage was built with the bindist Use flag enabled
USE="alsa -cups  systemd "
USE="${USE} wayland" 
# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.utf8



AUTO_CLEAN="yes"
ACCEPT_LICENSE="*"
ACCEPT_KEYWORDS="~amd64"

INPUT_DEVICES="libinput synaptics"
VIDEO_CARDS="amdgpu radeonsi nvidia nvidia_drm"
MAKEOPTS="-j12 -l14"
EMERGE_DEFAULT_OPTS="--jobs=4 --load-average=14  --with-bdeps=y --ask --verbose=y --deep"
GRUB_PLATFORMS="efi-64"

CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3"
